# Lock screen password field: a translucent card with HUD side rails.
# Thin top and bottom edges, thick left and right rails; the rails light up while typing.
background       = "#04070c"
background-alpha = 0.72
text             = "#d3e4f2"
placeholder      = "#76818b"
text-error       = "#ff5a4e"
border           = "#2e5a79"
border-active    = "#62bfff"
border-error     = "#ff5a4e"
border-alpha     = 1.0
border-width     = "1 3"
selection        = "#62bfff"
selection-alpha  = 0.4
